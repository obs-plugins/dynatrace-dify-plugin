identity:
  name: dynatrace_query_metric
  author: obs-plugins
  label:
    en_US: Query Metric
description:
  human:
    en_US: Query a Dynatrace metric timeseries by metric selector, with time window and resolution. Requires the metrics.read scope.
  llm: Queries a Dynatrace metric timeseries. Provide a metricSelector (e.g. builtin:service.response.time:avg). Use to inspect performance/health metrics over a time window.
parameters:
  - name: metric_selector
    type: string
    required: true
    label:
      en_US: Metric selector
    human_description:
      en_US: Dynatrace metric selector, e.g. builtin:service.response.time:avg
    llm_description: The Dynatrace metricSelector, including aggregation, e.g. "builtin:service.response.time:avg" or "builtin:host.cpu.usage:max".
    form: llm
  - name: from
    type: string
    required: false
    default: now-1h
    label:
      en_US: Time window (from)
    human_description:
      en_US: Start time, e.g. now-1h, now-24h.
    llm_description: Start of the time window (e.g. now-1h, now-6h, now-24h). Defaults to now-1h.
    form: llm
  - name: to
    type: string
    required: false
    label:
      en_US: Time window (to)
    human_description:
      en_US: End time. Defaults to now if omitted.
    llm_description: End of the time window. Omit for now.
    form: llm
  - name: resolution
    type: string
    required: false
    default: 1m
    label:
      en_US: Resolution
    human_description:
      en_US: Timeseries resolution, e.g. 1m, 5m, 1h.
    llm_description: Resolution of the timeseries (e.g. 1m, 5m, 1h). Coarser resolution over long windows keeps payloads small.
    form: llm
  - name: entity_selector
    type: string
    required: false
    label:
      en_US: Entity selector
    human_description:
      en_US: Optional entitySelector to scope the metric, e.g. type("SERVICE").
    llm_description: Optional Dynatrace entitySelector to filter which entities the metric is aggregated over.
    form: llm
extra:
  python:
    source: tools/query_metric.py
